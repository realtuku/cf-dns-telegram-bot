services:
  - type: web
    name: cf-dns-telegram-bot
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TELEGRAM_TOKEN
        sync: false
      - key: CF_API_TOKEN
        sync: false
      - key: ALLOWED_CHAT_IDS
        sync: false
